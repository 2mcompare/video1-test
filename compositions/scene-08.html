<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080"><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a1628;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:#e8edf5}
.clip{position:absolute}
:root{--blue-50:#e8f4fd;--blue-100:#b8dffa;--blue-300:#60b0f4;--blue-500:#2196f3;--blue-600:#1a7ad9;--blue-700:#0f5ba8;--blue-900:#0a1628;--blue-950:#060f1c;--white:#f0f4ff;--gray-300:#a0b4cc;--gray-400:#7a8fa8;--gray-500:#5a6f88;--cyan:#22d3ee;--green:#4ade80;--orange:#fb923c;--gold:#fbbf24;--red:#ef4444;--purple:#a78bfa}
.scene{position:absolute;width:1920px;height:1080px;overflow:hidden;background:var(--blue-900)}
.scene-content{position:absolute;width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;padding:80px 120px;gap:16px;box-sizing:border-box}
h1{font-size:76px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;color:var(--white)}
h2{font-size:52px;font-weight:700;letter-spacing:-.5px;line-height:1.1;color:var(--white)}
h3{font-size:36px;font-weight:600;line-height:1.15}
h4{font-size:24px;font-weight:600}
.body-text{font-size:22px;font-weight:400;line-height:1.5;color:var(--gray-300);max-width:1400px}
.accent-cyan{color:var(--cyan)}.accent-green{color:var(--green)}.accent-orange{color:var(--orange)}.accent-gold{color:var(--gold)}.accent-red{color:var(--red)}.accent-blue{color:var(--blue-300)}
.gradient-text{background:linear-gradient(135deg,var(--blue-300),var(--cyan),var(--blue-500));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(33,150,243,0.04)1px,transparent 1px),linear-gradient(90deg,rgba(33,150,243,0.04)1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.bg-glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(100px)}
.bg-glow-1{width:600px;height:600px;background:rgba(33,150,243,.1);top:-200px;right:-100px}
.bg-glow-2{width:400px;height:400px;background:rgba(34,211,238,.06);bottom:-100px;left:-100px}
.info-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px 32px;backdrop-filter:blur(8px)}
.model-pill{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);font-size:20px}
.model-pill .dot{width:12px;height:12px;border-radius:50%}
.bench-row{display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.bench-row .rank{font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--gray-500);width:40px}
.bench-row .model-name{font-size:22px;font-weight:600;flex:1}
.bench-row .bar-track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bench-row .bar-fill{height:100%;border-radius:4px}
.bench-row .bar-score{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;width:60px;text-align:right}
.bento-grid{display:grid;gap:12px}
.bento-grid-3{grid-template-columns:repeat(3,1fr)}
.bento-grid-2{grid-template-columns:repeat(2,1fr)}
.bento-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:28px}
.bento-item .num{font-size:42px;font-weight:800;color:rgba(255,255,255,.04);margin-bottom:-8px;font-family:'JetBrains Mono',monospace}
.bento-item .icon{font-size:32px;margin-bottom:8px}
.bento-item h4{font-size:20px;margin-bottom:8px}
.bento-item p{font-size:16px;color:var(--gray-400);line-height:1.5}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:24px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .medal{font-size:40px}
.pod .name{font-size:20px;font-weight:600}
.pod .score{font-size:36px;font-weight:800;font-family:'JetBrains Mono',monospace}
.pod .bar{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
.tag{display:inline-block;padding:6px 14px;border-radius:100px;font-size:14px;font-weight:600;margin:3px}
.tag-blue{background:rgba(33,150,243,.1);color:var(--blue-300);border:1px solid rgba(33,150,243,.2)}
.tag-cyan{background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.2)}
.tag-red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.tag-gray{background:rgba(255,255,255,.04);color:var(--gray-400);border:1px solid rgba(255,255,255,.08)}
.transition-overlay{position:absolute;width:1920px;height:1080px;background:var(--blue-950);z-index:100;pointer-events:none}
/* CSS entrance animations */
.anim-in{animation:fadeIn 700ms ease-out both}
.anim-in-slow{animation:fadeIn 900ms ease-out both}
.anim-in-left{animation:slideLeft 700ms ease-out both}
.anim-in-scale{animation:scaleIn 600ms cubic-bezier(.16,1,.3,1) both}
.anim-in-bounce{animation:scaleIn 600ms cubic-bezier(.68,-.55,.27,1.55) both}
.anim-in-pop{animation:scaleIn 500ms cubic-bezier(.68,-.55,.27,1.55) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes bgShift{0%{transform:translate(0,0)scale(1)}50%{transform:translate(20px,-20px)scale(1.05)}100%{transform:translate(0,0)scale(1)}}
.bg-glow-1{animation:bgShift 15s ease-in-out infinite,glowPulse 8s ease-in-out infinite}
.bg-glow-2{animation:bgShift 18s ease-in-out infinite reverse,glowPulse 10s ease-in-out infinite}</style></head><body><div data-composition-id="scene-08" data-start="0" data-duration="60.4" data-width="1920" data-height="1080"><div id="s8" class="scene clip" data-start="0" data-duration="60.4" data-track-index="0"><div class="bg-grid"></div><div class="bg-glow bg-glow-1"></div>
