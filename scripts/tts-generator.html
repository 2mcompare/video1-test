<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TTS Generator</title>
<style>
body { font-family: system-ui, sans-serif; background: #0a1628; color: #e0e6ed; padding: 30px; max-width: 900px; margin: 0 auto; }
h1 { color: #22d3ee; margin-bottom: 20px; }
.status { padding: 8px 16px; margin: 5px 0; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; }
.status.done { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.05); }
.status.fail { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
.status .id { font-family: monospace; font-size: 14px; color: #7a8fa8; width: 100px; }
.status .msg { flex: 1; font-size: 14px; }
.status .dur { font-family: monospace; font-size: 12px; color: #5a6f88; width: 60px; }
button { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
#start { background: #2196f3; color: white; margin-right: 10px; }
#start:hover { background: #1a7ad9; }
#start:disabled { opacity: 0.4; cursor: not-allowed; }
#retry-all { background: rgba(255,255,255,0.08); color: #e0e6ed; border: 1px solid rgba(255,255,255,0.1); }
textarea { width: 100%; height: 80px; margin: 8px 0; background: #060f1c; color: #e0e6ed; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px; font-size: 13px; }
#progress-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin: 16px 0; }
#progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2196f3, #22d3ee); transition: width 0.3s; }
</style>
</head>
<body>
<h1>AI Model Benchmark — TTS Generator</h1>
<p style="color:#7a8fa8;margin-bottom:16px;">Using Puter.js with Gemini TTS for high-quality voiceover. Downloads audio files automatically.</p>

<div id="progress-bar"><div id="progress-fill"></div></div>

<button id="start">Generate All 11 Audio Files</button>
<button id="retry-all" style="display:none;">Retry Failed</button>

<div id="status-list"></div>

<script src="https://js.puter.com/v2/"></script>
<script>
const sections = [
  { id: "01-hook", text: "So I gave five AI models the exact same coding prompt. Same task. Same rules. Same deadline. And I told them to fight. The prompt was brutal — build a full OS-style dashboard website, from scratch, in a single HTML file, with zero libraries, zero dependencies — pure code only. And the results? Completely different. Like, not even close. One model produced something genuinely impressive. Clean code, working animations, proper structure. And another one broke on line three. Line. Three. Out of eight hundred. Yeah. We need to talk about that. Stick around because by the end of this video you will know exactly which AI to use for frontend coding — and which one to never trust with a CSS file again. Let us get into it." },
  { id: "02-setup", text: "Okay so before we get into the results, let me show you exactly what I asked these models to build. The prompt had eight mandatory sections. Every model got the same list. Number one — an OS-style topbar. With a live clock, a dark mode toggle that saves to localStorage, and a battery widget. Number two — a fake terminal that types out a boot sequence automatically when you open the page. Number three — this is the one that breaks models — a pure SVG radar chart. Six axes, animated on scroll, with zero libraries. Just math. Raw trigonometry in JavaScript. Then on top of that: an infinite scrolling stats ticker, six feature cards with staggered animations, a quiz section, a syntax-highlighted code block, and a footer. All of that. In one HTML file. Zero CDN links. Zero imports. And the most important rule? The models had to think step by step before writing a single line of code. That one instruction alone filters out the lazy outputs. Alright. Let us look at what they actually built." },
  { id: "03-deepseek", text: "First up — DeepSeek V4 Flash. And honestly? This is the one that surprised me most. Look at that terminal. It has an actual file path in the title bar. Like a real terminal. Not just some placeholder text — it looks like you are actually running a program. The radar chart is working — all six axes are labeled, the values animate as you scroll, and the polygon is mathematically correct. That is harder than it sounds. This is pure JavaScript trigonometry, no library doing the work. The stats ticker uses these little dropdown pill things — I did not ask for that. That is the model being creative with the brief. I like that. The code showcase? It is using async Python with proper streaming. Not a stub. Not fake code. Actual real implementation. Now — there is one bug. And it is a consistent bug across all five models actually. The feature cards section is basically invisible. The glassmorphism opacity is set too low on a dark background so you just get nothing. A blank section. That would have pushed this to a nine out of ten easily. But even with that — DeepSeek Flash is the strongest coder here. Clean IIFEs, proper CSS custom properties, readable structure. If you are using AI for frontend work, this is your model." },
  { id: "04-bigpickle", text: "Okay. Big Pickle. So the brief for this one was intentionally weird. I asked the model to build something that was simultaneously technically serious AND themed like a deli pickle. Funny brand, real code. And somehow — it worked? Look at that terminal boot sequence. Loading brine one hundred percent. Fermenting reasoning engine. Ready. No cap. That is so good. The model understood the joke AND executed it with proper typewriter animation. The radar chart is fully working. The bubble background animation — where little fizz bubbles float up like a pickle jar — that is the most creative visual effect of all five submissions. I did not ask for that specifically. The model invented it. The quiz questions are actual lateral thinking puzzles. Not trivia. Real logic problems wrapped in pickle metaphors. The code is also the most readable of all five. Good comments, clean structure, clear variable names. Now — same invisible cards bug. And it went way over the line limit. I said eight hundred lines, it gave me twelve hundred. But honestly the extra length came from good things, not padding. Eight out of ten. And in terms of personality and brand coherence? It is actually the best submission. No contest." },
  { id: "05-mimo", text: "MiMo v2.5 from Xiaomi. And this one I want you to pay attention to because there is an important lesson here. MiMo is a seven billion parameter model. That is tiny compared to the others. And it scored seven point five out of ten. That terminal? Best terminal of the five. It uses these tag-style labels — boot, load, spec, core — that make it feel like an actual system log. Very detailed, very deliberate. The quiz questions are math problems. Real math. Because MiMo is a reasoning and math model, and the model knew that about itself and leaned into it. That is contextual intelligence. The radar chart is correct. Axis labels, values, proper animation. At seven billion parameters. Think about that. But the feature cards — invisible. Same bug. And the ticker is really sparse, like it only cycles through a few items before looping. That hurts it. Still — seven point five from a seven billion parameter model is genuinely impressive. Do not sleep on small reasoning models for coding tasks." },
  { id: "06-gemma", text: "Gemma four, thirty-one billion parameters from Google DeepMind. And this one is a bit disappointing. The structure is there. The topbar is actually the cleanest of all five — minimal, well-designed. The terminal works. Dark mode toggle works. These basics are solid. But then you get to the radar chart. And look at this — it is just a solid blue hexagon. No axis labels. No score values. No grid lines. No animation. It drew a shape and called it a day. The JavaScript is there — the model wrote a function for the radar chart. But it skipped the actual trigonometry. It drew a fixed hexagon instead of computing the polygon from the axis values. The feature cards section is just a massive blank dark area. The ticker shows one line. The particle background effect that I specifically asked for — completely absent. And here is the thing that gets me — MiMo is seven billion parameters and outscored Gemma, which is thirty-one billion. Size is not quality. Remember that." },
  { id: "07-nemotron", text: "And then there is Nemotron. I do not even know where to start. So here is what happened. On line three of the file — line THREE — Nemotron wrote this: double dash, a one, colon, quote, hash, number, quote. CSS custom properties with the hex color value wrapped in quotation marks. That is not how CSS variables work. A CSS custom property stores a value, not a string. The moment you wrap it in quotes, it becomes a string, and every single place in the file that uses that variable renders nothing. No color. Just empty. So the logo SVG renders as a black broken shape. The radar chart is just a random static polygon floating in the middle of the page. One of the feature cards is literally floating outside the grid because of an unclosed HTML tag. And the VRAM widget — which was supposed to be a cool monitoring indicator — is a banana emoji on a gray box. A. Banana. Emoji. The clock works. I will give it that. The clock ticks every second. The quiz questions about GPU parallelism are actually technically correct. So it gets one out of ten. But this is a model from NVIDIA — the company that makes the chips that run all these AI models — and it could not write a valid CSS variable on line three of the output. That is not a small bug. That is a fundamental failure." },
  { id: "08-leaderboard", text: "Okay so let us recap the final rankings fast. First place — DeepSeek V4 Flash. Eight point five out of ten. Best code quality, most complete submission, most professional output. Second place — Big Pickle. Eight out of ten. Best personality, best creative execution, most readable code. Third place — MiMo v2.5. Seven point five. Punching massively above its weight class for a seven B model. Impressive. Fourth — Gemma four. Four out of ten. Structure without execution. Disappointing for a thirty-one B model. Fifth — Nemotron. One out of ten. A banana emoji. You understand. And interesting thing — there were a few places where your rating and my rating disagreed. You gave Big Pickle a six. I gave it an eight, because the code quality underneath the design issues is genuinely strong. You gave MiMo an eight — I went seven point five because the ticker and cards hurt it more in my view. Neither of us is wrong. These are judgment calls." },
  { id: "09-takeaways", text: "Before the final verdict, let me hit you with the things this test actually revealed — because there are some surprises here. Takeaway one — every single model produced invisible feature cards. All five. Not one of them got it right. That specific combination — glassmorphism backgrounds plus IntersectionObserver plus hover glow — is the hardest part of the prompt. And it is the thing that would have separated a seven from a nine. Nobody cracked it in one shot. Takeaway two — the radar chart is the real test. It requires writing trigonometry from scratch. Sine, cosine, polygon math. DeepSeek and Big Pickle did it correctly. Gemma drew a hexagon. Nemotron drew something unrecognizable. That SVG math is where good models separate from great ones. Takeaway three — parameter count means nothing for frontend coding quality. A seven billion parameter model beat a thirty-one billion parameter model. If you are picking a model for a coding task, look at benchmarks for that specific task — not the raw parameter number. Takeaway four — one bug can collapse the whole thing. Nemotron's single CSS syntax error on line three destroyed every piece of styling in the file. Self-review is not optional. Always tell your AI to check its own output. And takeaway five — the instruction to think step by step before writing code genuinely matters. MiMo's terminal and quiz — its strongest sections — show deep contextual understanding that only happens when the model plans before executing. That single line in the prompt makes a real difference." },
  { id: "10-verdict", text: "Alright. Final verdict. Here is the honest answer to — which model should you actually use? For frontend coding — DeepSeek V4 Flash. It is not even close. If you need reliable, multi-constraint code that follows a complex brief without going off the rails, this is your model. Use it. For creative briefs — when the project has personality, humor, or a specific brand voice alongside technical requirements — Big Pickle is exceptional. It held both registers at the same time, which is genuinely hard to do. If you are resource constrained and need a small model — MiMo. Seven billion parameters, seven point five out of ten. That is remarkable. And for this specific kind of complex single-file frontend work — skip Nemotron and skip Gemma four. Neither is ready for this use case in its current form. Gemma might surprise you on other tasks but frontend code is not it right now." },
  { id: "11-outro", text: "And that is the test. Five models, one prompt, very different results. If you want to run this yourself — the full prompt is in the description. Just paste it into whichever model you want to test, save the output as an HTML file, and open it in your browser. It takes five minutes. Drop in the comments — which model do you think would win if we ran this test again in six months? If this was useful, hit the like button, it genuinely helps the channel, and I will see you in the next one." }
];

const statusList = document.getElementById("status-list");
const progressFill = document.getElementById("progress-fill");
const startBtn = document.getElementById("start");
const retryBtn = document.getElementById("retry-all");

function createStatusEl(section) {
  const div = document.createElement("div");
  div.className = "status";
  div.id = "status-" + section.id;
  div.innerHTML = `<span class="id">${section.id}</span><span class="msg">⏳ Waiting...</span><span class="dur"></span>`;
  statusList.appendChild(div);
  return div;
}

function updateStatus(id, msg, type, dur) {
  const el = document.getElementById("status-" + id);
  if (!el) return;
  el.className = "status" + (type ? " " + type : "");
  el.querySelector(".msg").textContent = msg;
  if (dur) el.querySelector(".dur").textContent = dur;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 2000);
}

async function generateOne(section) {
  updateStatus(section.id, "⏳ Generating with Gemini TTS...");
  try {
    const result = await puter.ai.txt2speech(section.text, {
      provider: "gemini",
      model: "gemini-2.5-flash-preview-tts",
      voice: "Puck",
      instructions: "Speak in a natural, conversational YouTube narrator tone. Clear, engaging, warm."
    });
    
    let blob;
    if (result instanceof Blob) {
      blob = result;
    } else if (result instanceof Audio) {
      const resp = await fetch(result.src);
      blob = await resp.blob();
    } else if (result?.src) {
      const resp = await fetch(result.src);
      blob = await resp.blob();
    } else if (result?.blob) {
      blob = await result.blob();
    } else {
      throw new Error("Unknown response type");
    }
    
    downloadBlob(blob, `${section.id}.mp3`);
    updateStatus(section.id, `✓ Downloaded (${(blob.size / 1024).toFixed(0)} KB)`, "done", `${(blob.size / 1024).toFixed(0)} KB`);
    return true;
  } catch (err) {
    // Fallback to neural TTS
    try {
      updateStatus(section.id, "⏳ Gemini unavailable, trying Neural...");
      const result = await puter.ai.txt2speech(section.text, {
        voice: "Matthew",
        engine: "neural",
        language: "en-US"
      });
      
      let blob;
      if (result instanceof Blob) {
        blob = result;
      } else if (result instanceof Audio) {
        const resp = await fetch(result.src);
        blob = await resp.blob();
      } else if (result?.src) {
        const resp = await fetch(result.src);
        blob = await resp.blob();
      } else {
        throw new Error("Unknown response type from neural TTS");
      }
      
      downloadBlob(blob, `${section.id}.mp3`);
      updateStatus(section.id, `✓ Neural fallback (${(blob.size / 1024).toFixed(0)} KB)`, "done", `${(blob.size / 1024).toFixed(0)} KB`);
      return true;
    } catch (err2) {
      updateStatus(section.id, "✗ Failed: " + (err2.message || err2).slice(0, 60), "fail");
      return false;
    }
  }
}

async function generateAll() {
  statusList.innerHTML = "";
  sections.forEach(s => createStatusEl(s));
  
  startBtn.disabled = true;
  startBtn.textContent = "Generating...";
  
  let done = 0, failed = 0;
  for (let i = 0; i < sections.length; i++) {
    const ok = await generateOne(sections[i]);
    if (ok) done++; else failed++;
    progressFill.style.width = ((i + 1) / sections.length * 100) + "%";
    await new Promise(r => setTimeout(r, 1000));
  }
  
  startBtn.disabled = false;
  startBtn.textContent = `Done (${done}/11) — Files downloaded to your browser`;
  if (failed > 0) {
    retryBtn.style.display = "inline-block";
    retryBtn.textContent = `Retry ${failed} Failed`;
  }
}

startBtn.addEventListener("click", generateAll);
retryBtn.addEventListener("click", async () => {
  const failed = document.querySelectorAll(".status.fail");
  retryBtn.style.display = "none";
  for (const el of failed) {
    const id = el.querySelector(".id").textContent;
    const section = sections.find(s => s.id === id);
    if (section) {
      const ok = await generateOne(section);
      if (ok) {
        const done = document.querySelectorAll(".status.done").length;
        progressFill.style.width = (done / sections.length * 100) + "%";
      }
    }
  }
  if (document.querySelectorAll(".status.fail").length === 0) {
    startBtn.textContent = "All Complete!";
  }
});
</script>
</body>
</html>
